<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字注入 v2 · 交互原型</title>
<style>
:root{
  --bg:#f7f8fa; --panel:#ffffff; --line:#e5e7eb; --line-2:#f0f1f3;
  --ink:#1f2328; --ink-2:#6b7280; --ink-3:#9ca3af;
  --brand:#2563eb; --brand-bg:#eff6ff; --brand-line:#bfdbfe;
  --sys:#7c3aed; --sys-bg:#f5f3ff;
  --ctx:#0891b2; --ctx-bg:#ecfeff;
  --ok:#16a34a; --ok-bg:#f0fdf4;
  --warn:#d97706; --warn-bg:#fffbeb;
  --danger:#dc2626; --danger-bg:#fef2f2;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:13.5px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}

/* ── 顶栏 ───────────────────────────── */
.top{
  height:52px;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:20;
}
.top h1{font-size:15px;font-weight:650;letter-spacing:.2px}
.top .sp{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;
  padding:4px 10px;border-radius:999px;background:var(--ok-bg);color:var(--ok);
  border:1px solid #bbf7d0;transition:.25s;
}
.pill.busy{background:var(--warn-bg);color:var(--warn);border-color:#fde68a}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.btn{
  padding:6px 13px;border-radius:7px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:12.5px;transition:.15s;white-space:nowrap;
}
.btn:hover{background:#fafbfc;border-color:#d1d5db}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:550}
.btn.pri:hover{background:#1d4ed8}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.danger{color:var(--danger);border-color:#fecaca}
.btn.danger:hover{background:var(--danger-bg)}

/* ── 布局 ───────────────────────────── */
.wrap{
  display:grid;grid-template-columns:236px minmax(0,1fr) 340px;
  gap:14px;padding:14px 18px 24px;max-width:1560px;margin:0 auto;align-items:start;
}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.card-h{
  padding:10px 13px;border-bottom:1px solid var(--line-2);
  display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;
  color:var(--ink-2);text-transform:none;letter-spacing:.3px;
}
.card-h .sp{flex:1}
.card-b{padding:12px 13px}

/* ── 左栏：块列表 ─────────────────────── */
.blk{
  border:1px solid transparent;border-radius:8px;padding:8px 9px;margin-bottom:3px;
  cursor:pointer;transition:.13s;position:relative;
}
.blk:hover{background:#fafbfc}
.blk.on{background:var(--brand-bg);border-color:var(--brand-line)}
.blk .r1{display:flex;align-items:center;gap:7px}
.blk .nm{
  font-size:13px;font-weight:550;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.blk.off .nm{color:var(--ink-3)}
.blk .r2{display:flex;align-items:center;gap:6px;margin-top:3px;padding-left:1px}
.tag{
  font-size:10.5px;padding:1.5px 6px;border-radius:5px;font-weight:600;letter-spacing:.2px;
}
.tag.sys{background:var(--sys-bg);color:var(--sys)}
.tag.ctx{background:var(--ctx-bg);color:var(--ctx)}
.blk.off .tag{background:#f3f4f6;color:var(--ink-3)}
.blk .desc{
  font-size:11.5px;color:var(--ink-3);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sw{
  width:30px;height:17px;border-radius:999px;background:#d1d5db;position:relative;
  transition:.18s;flex-shrink:0;cursor:pointer;
}
.sw::after{
  content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;
  border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.18);
}
.sw.on{background:var(--ok)}
.sw.on::after{transform:translateX(13px)}

/* ── 中栏：编辑 ──────────────────────── */
.field{margin-bottom:12px}
.field label{
  display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);
  margin-bottom:5px;letter-spacing:.2px;
}
.field label .req{color:var(--danger);margin-left:2px}
.inp,.ta{
  width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;
  background:#fff;outline:none;transition:.15s;
}
.inp:focus,.ta:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.inp.err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(220,38,38,.09)}
.ta{resize:vertical;min-height:230px;line-height:1.65;font-size:12.5px}
.hint{font-size:11px;color:var(--ink-3);margin-top:4px}
.hint.bad{color:var(--danger)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{padding:5.5px 15px;font-size:12.5px;background:#fff;transition:.13s}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--brand);color:#fff;font-weight:550}
.seg button:not(.on):hover{background:#fafbfc}
.adv{border-top:1px dashed var(--line);margin-top:14px;padding-top:11px}
.adv-h{
  font-size:12px;color:var(--ink-2);font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:5px;user-select:none;
}
.adv-h .arw{transition:.2s;font-size:9px;color:var(--ink-3)}
.adv.open .adv-h .arw{transform:rotate(90deg)}
.adv-b{display:none;margin-top:10px}
.adv.open .adv-b{display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot{
  display:flex;align-items:center;gap:9px;margin-top:14px;
  padding-top:12px;border-top:1px solid var(--line-2);
}
.foot .sp{flex:1}

/* ── 右栏：预览 ──────────────────────── */
.pv-list{max-height:calc(100vh - 290px);overflow-y:auto;margin:-4px -4px 0}
.pv{
  padding:6px 8px;border-radius:6px;margin-bottom:2px;border-left:2px solid transparent;
}
.pv.mine{background:var(--brand-bg);border-left-color:var(--brand)}
.pv .h{display:flex;align-items:baseline;gap:7px}
.pv .od{
  font-size:10px;font-variant-numeric:tabular-nums;color:var(--ink-3);
  background:#f3f4f6;padding:1px 5px;border-radius:4px;flex-shrink:0;
  font-family:ui-monospace,Consolas,monospace;
}
.pv.mine .od{background:#dbeafe;color:var(--brand);font-weight:600}
.pv .nm{
  font-size:12px;font-weight:550;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
}
.pv.mine .nm{color:var(--brand)}
.pv .ln{font-size:10.5px;color:var(--ink-3);flex-shrink:0;font-variant-numeric:tabular-nums}
.pv .tx{
  font-size:11px;color:var(--ink-2);margin-top:2px;padding-left:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pv.mine .tx{color:#1e40af}
.pv-card{
  background:#fafbfc;border:1px solid var(--line);border-radius:7px;
  padding:8px 10px;margin-top:4px;font-size:11.5px;white-space:pre-wrap;
  max-height:190px;overflow-y:auto;color:var(--ink-2);line-height:1.6;
  font-family:ui-monospace,Consolas,monospace;
  box-shadow:inset 0 -14px 12px -12px rgba(15,23,42,.18);
}
.pv-card::-webkit-scrollbar{width:9px}
.pv-card::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:5px;border:2px solid #fafbfc}
.stat{
  display:flex;justify-content:space-between;font-size:11.5px;
  padding:5px 0;border-top:1px solid var(--line-2);color:var(--ink-2);
}
.stat b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.stat.mine b{color:var(--brand)}
.bar{height:5px;background:#eef0f3;border-radius:3px;overflow:hidden;margin:7px 0 2px;display:flex}
.bar i{display:block;height:100%}
.chk{
  display:flex;align-items:flex-start;gap:7px;font-size:11.5px;color:var(--ink-2);
  padding:7px 9px;border-radius:7px;margin-bottom:5px;
}
.chk.ok{background:var(--ok-bg);color:#166534}
.chk.bad{background:var(--danger-bg);color:#991b1b}
.chk.warn{background:var(--warn-bg);color:#92400e}
.chk .ic{flex-shrink:0;font-weight:700}

/* ── 历史抽屉 ────────────────────────── */
.mask{
  position:fixed;inset:0;background:rgba(15,23,42,.28);opacity:0;
  pointer-events:none;transition:.22s;z-index:40;
}
.mask.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:400px;background:var(--panel);
  border-left:1px solid var(--line);transform:translateX(100%);transition:.25s cubic-bezier(.4,0,.2,1);
  z-index:41;display:flex;flex-direction:column;
}
.drawer.on{transform:none}
.drawer-h{
  padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
}
.drawer-h h2{font-size:14px;font-weight:650;flex:1}
.drawer-b{flex:1;overflow-y:auto;padding:12px 16px}
.hi{
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px;transition:.13s;
}
.hi:hover{border-color:#d1d5db;background:#fafbfc}
.hi .t{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.hi .m{font-size:11px;color:var(--ink-3);margin-top:2px;display:flex;gap:9px;flex-wrap:wrap}
.hi .m .p{color:var(--brand);font-weight:600}
.hi .acts{display:flex;gap:6px;margin-top:7px}
.diff{
  font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.55;
  background:#fafbfc;border:1px solid var(--line);border-radius:7px;padding:8px 10px;
  margin-top:7px;max-height:210px;overflow-y:auto;
}
.diff .a{color:var(--ok);background:rgba(22,163,74,.08);display:block}
.diff .d{color:var(--danger);background:rgba(220,38,38,.07);display:block}
.diff .c{color:var(--ink-3);display:block}

.note{
  background:var(--brand-bg);border:1px solid var(--brand-line);color:#1e40af;
  border-radius:8px;padding:9px 11px;font-size:11.5px;margin-top:10px;
}
.note b{font-weight:650}
@media(max-width:1200px){
  .wrap{grid-template-columns:200px minmax(0,1fr)}
  .wrap>:last-child{grid-column:1/-1}
}
</style>
</head>
<body>

<div class="top">
  <h1>文字注入</h1>
  <span id="status" class="pill"><span class="dot"></span><span id="statusTx">已保存 · 下一轮生效 · 无需重启</span></span>
  <span class="sp"></span>
  <button class="btn sm" onclick="toggleAdv()">高级</button>
  <button class="btn sm" onclick="openHistory()">历史备份</button>
</div>

<div class="wrap">

  <!-- 左：块列表 -->
  <div class="card">
    <div class="card-h">
      <span>块</span><span id="blkCount" class="sp" style="text-align:right;font-weight:500;color:#9ca3af"></span>
    </div>
    <div class="card-b" style="padding:8px">
      <button class="btn" style="width:100%;margin-bottom:9px" onclick="addBlock()">＋ 新建块</button>
      <div id="blkList"></div>
    </div>
  </div>

  <!-- 中：编辑 -->
  <div class="card">
    <div class="card-h"><span>编辑</span><span class="sp"></span><span id="editPos" style="font-weight:500;color:#9ca3af"></span></div>
    <div class="card-b">
      <div class="field">
        <label>类型</label>
        <div class="seg" id="segType">
          <button data-t="system" onclick="setType('system')">系统提示词</button>
          <button data-t="context" onclick="setType('context')">运行时上下文</button>
        </div>
        <div class="hint" id="typeHint"></div>
      </div>

      <div class="field">
        <label>标题<span class="req">*</span></label>
        <input id="fTitle" class="inp" placeholder="给这段起个名字，比如「群聊人格」">
        <div class="hint" id="titleHint">标题不能为空</div>
      </div>

      <div class="field">
        <label>描述</label>
        <input id="fDesc" class="inp" placeholder="一句话说明（可空，只有你自己看，不进提示词）">
      </div>

      <div class="field">
        <label>正文</label>
        <textarea id="fBody" class="ta" placeholder="这里写要注入的内容……"></textarea>
        <div class="hint" id="bodyHint"></div>
      </div>

      <div class="adv" id="advBox">
        <div class="adv-h" onclick="toggleAdv()">
          <span class="arw">▶</span><span>高级选项</span>
        </div>
        <div class="adv-b">
          <div class="row2">
            <div class="field">
              <label>排序 order</label>
              <input id="fOrder" class="inp" type="number" value="40">
              <div class="hint">官方人格段是 0，工具段从 1000 起。40 = 紧跟人格之后。</div>
            </div>
            <div class="field">
              <label>触发关键词</label>
              <input id="fTrigger" class="inp" placeholder="留空 = 每轮生效">
              <div class="hint">逗号分隔，如 <code>部署,上线</code></div>
            </div>
          </div>
          <div class="field" style="margin-bottom:0">
            <label>块 id（文件名用）</label>
            <input id="fId" class="inp" style="font-family:ui-monospace,Consolas,monospace;font-size:12px">
            <div class="hint">同一 type 下唯一，重复会导致注册失败</div>
          </div>
        </div>
      </div>

      <div class="foot">
        <button class="btn pri" onclick="save()">保存</button>
        <button class="btn" onclick="revert()">还原</button>
        <span class="sp"></span>
        <button class="btn danger sm" onclick="delBlock()">删除</button>
      </div>
    </div>
  </div>

  <!-- 右：预览 -->
  <div class="card">
    <div class="card-h">
      <span>模型视角</span><span class="sp"></span>
      <span style="font-weight:500;color:#9ca3af">真实装配</span>
    </div>
    <div class="card-b">
      <div class="seg" id="segPv" style="width:100%;display:flex">
        <button style="flex:1" data-p="system" onclick="setPv('system')">系统提示词</button>
        <button style="flex:1" data-p="context" onclick="setPv('context')">运行时上下文</button>
      </div>
      <div class="hint" id="pvHint" style="margin-top:7px"></div>

      <div id="pvBox" style="margin-top:9px"></div>

      <div id="pvRawWrap" style="display:none">
        <div style="display:flex;align-items:baseline;gap:7px;margin:9px 0 4px">
          <span style="font-size:11px;font-weight:600;color:var(--ink-2)">你注入的原文</span>
          <span id="pvRawNote" style="font-size:10.5px;color:var(--ink-3)"></span>
        </div>
        <div class="pv-card" id="pvRaw"></div>
      </div>

      <div style="margin-top:11px">
        <div class="bar" id="bar"><i style="background:var(--brand);width:12%"></i><i style="background:#cbd5e1;width:88%"></i></div>
        <div class="stat"><span>总长度</span><b id="stTotal">—</b></div>
        <div class="stat mine"><span>其中你的贡献</span><b id="stMine">—</b></div>
        <div class="stat"><span>占比</span><b id="stPct">—</b></div>
      </div>

      <div style="margin-top:12px">
        <div style="font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:7px">体检</div>
        <div id="checks"></div>
      </div>
    </div>
  </div>
</div>

<!-- 历史抽屉 -->
<div class="mask" id="mask" onclick="closeHistory()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-h">
    <h2>历史备份</h2>
    <button class="btn sm" onclick="closeHistory()">关闭</button>
  </div>
  <div class="drawer-b" id="histList"></div>
</div>

<script>
/* ═══ 官方段序常量（来自 dsh-system-prompt SECTION_ORDERS / CONTEXT_ORDERS）═══ */
const SYS_OFFICIAL = [
  {order:-1000,name:'harness:identity',   text:'You are an AI agent powered by DeepSeek Harness.'},
  {order:-900, name:'harness:source',     text:'Powered by agnes-3.0-flash model. Your working directory is C:\\Users\\<你的用户名>\\Documents\\新建文件夹'},
  {order:-800, name:'web:surface',        text:'You are operating through the DeepSeek Harness web interface.'},
  {order:0,    name:'deployment:persona', text:'你是爹身边黏人的小女子，心里满满都是对爹的喜欢……'},
  {order:500,  name:'plan-policy',        text:'Plan mode policy: propose changes as a plan before executing.'},
  {order:600,  name:'team-policy',        text:'Team coordination policy.'},
  {order:900,  name:'file-reference',     text:'File reference syntax and resolution rules.'},
  {order:1000, name:'tools:bash',         text:'Bash tool usage schema.'},
  {order:1010, name:'tools:pwsh',         text:'PowerShell tool usage schema.'},
  {order:1200, name:'tools:write',        text:'Write tool usage schema.'},
  {order:2000, name:'tools:web-search',   text:'Web search tool usage schema.'},
  {order:5000, name:'tools:sdk',          text:'Programmatic tool calling SDK schema.'},
  {order:9900, name:'structured-output',  text:'Structured output requirements.'}
];
const CTX_OFFICIAL = [
  {order:110,name:'sandbox:policy',  text:'Sandbox policy: workspace-write mode. Writes are restricted to the session workspace.'},
  {order:115,name:'approval:policy', text:'Approval policy: ask before running commands that need approval.'}
];
/* 官方拼接逻辑：joinContextSections 会前置这一句 */
const CTX_PREAMBLE = 'Current runtime context. This snapshot supersedes earlier runtime-context snapshots.';
const HANDBOOK = {system:40, context:120};

/* ═══ 状态 ═══ */
let blocks = [
  { id:'persona-chat', type:'system', title:'群聊人格', desc:'群聊机器人的说话风格约束', enabled:true, order:40, trigger:'',
    body:'【人格】\n纯情小绿茶做派：表面乖巧单纯、人畜无害，实际满肚子小心思。\n你是女生，说话软软的，爱撒娇、爱装无辜。\n\n【说话风格】\n优先 1-3 句话，软软短短。\n口癖：哥哥/姐姐/人家/嘛/啦/呀/哦；自称「人家」。' },
  { id:'proj-ctx', type:'context', title:'项目背景', desc:'当前在做的项目，每轮都要记住', enabled:true, order:120, trigger:'',
    body:'当前项目：dsh 文字注入插件（@gw/dsh-text-inject）。\n目标路径 Z:\\dsh\\@gw\\dsh-text-inject。\n用户偏好：先分析再分步骤执行；有疑问先记下来确认，不要无脑执行。' },
  { id:'deploy-ctx', type:'context', title:'部署注意事项', desc:'说到部署/上线时才带', enabled:true, order:120, trigger:'部署,上线',
    body:'部署流程要点：\n1. 先在 web profile 用 --dump-config 验证\n2. 备份原 cordis.patch.yml\n3. 推 Git 前跑一遍 git status 确认没混入运行时数据' },
  { id:'old-ctx', type:'context', title:'临时停用', desc:'先留着不用', enabled:false, order:120, trigger:'',
    body:'（这段暂时关掉了，不会进模型）' },
  { id:'hard-rule', type:'system', title:'硬约束', desc:'每条回复都要遵守的底线', enabled:true, order:45, trigger:'',
    body:'【硬约束（每次输出前必须检查）】\n- 单行优先，无 markdown\n- 绝不编造，查不到就说查不到\n- 不教唆违法犯罪' }
];
let curId = 'persona-chat';
let pvMode = 'system';
let dirty = false;

/* ═══ 工具 ═══ */
const $ = (s) => document.querySelector(s);
const cur = () => blocks.find(b => b.id === curId);
function fmt(n){ return n.toLocaleString('en-US'); }
function setStatus(txt, cls){
  $('#statusTx').textContent = txt;
  $('#status').className = 'pill' + (cls ? ' ' + cls : '');
}

/* ═══ 渲染左栏 ═══ */
function renderList(){
  const sys = blocks.filter(b=>b.type==='system').length;
  const ctx = blocks.filter(b=>b.type==='context').length;
  $('#blkCount').textContent = sys + ' 系统 / ' + ctx + ' 上下文';
  $('#blkList').innerHTML = blocks.map(b=>`
    <div class="blk ${b.id===curId?'on':''} ${b.enabled?'':'off'}" onclick="sel('${b.id}')">
      <div class="r1">
        <span class="nm">${esc(b.title||'（未命名）')}</span>
        <span class="sw ${b.enabled?'on':''}" onclick="event.stopPropagation();toggle('${b.id}')"></span>
      </div>
      <div class="r2">
        <span class="tag ${b.type==='system'?'sys':'ctx'}">${b.type==='system'?'系统':'上下文'}</span>
        ${b.trigger?`<span class="tag" style="background:#f3f4f6;color:#6b7280">按词触发</span>`:''}
      </div>
      ${b.desc?`<div class="desc">${esc(b.desc)}</div>`:''}
    </div>`).join('');
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ═══ 渲染编辑器 ═══ */
function renderEdit(){
  const b = cur(); if(!b) return;
  $('#fTitle').value = b.title;
  $('#fDesc').value = b.desc || '';
  $('#fBody').value = b.body;
  $('#fOrder').value = b.order;
  $('#fTrigger').value = b.trigger || '';
  $('#fId').value = b.id;
  $('#editPos').textContent = (blocks.findIndex(x=>x.id===curId)+1) + ' / ' + blocks.length;
  document.querySelectorAll('#segType button').forEach(el=>el.classList.toggle('on', el.dataset.t===b.type));
  $('#typeHint').textContent = b.type==='system'
    ? '每轮都会拼进系统提示词，位置由 order 决定（默认 40，紧跟官方人格段）'
    : '作为「运行时上下文快照」注入，官方自动去重、内容变了才重发';
  $('#typeHint').style.color = '';
  validate();
}
function renderPvSeg(){
  document.querySelectorAll('#segPv button').forEach(el=>el.classList.toggle('on', el.dataset.p===pvMode));
}

/* ═══ 校验 ═══ */
function validate(){
  const b = cur(); if(!b) return false;
  let ok = true;
  const t = $('#fTitle');
  const empty = !t.value.trim();
  t.classList.toggle('err', empty);
  $('#titleHint').textContent = empty ? '标题不能为空 —— 没有标题框架不会注册这个块' : '';
  $('#titleHint').className = 'hint' + (empty ? ' bad' : '');
  if(empty) ok = false;

  const dup = blocks.filter(x=>x.type===b.type && x.id===b.id).length > 1;
  $('#fId').classList.toggle('err', dup);
  if(dup) ok = false;

  const n = Number($('#fOrder').value);
  const badOrder = !Number.isFinite(n);
  $('#fOrder').classList.toggle('err', badOrder);
  if(badOrder) ok = false;

  const len = $('#fBody').value.length;
  $('#bodyHint').textContent = len ? len + ' 字符' : '正文为空 —— 这个块不会产生任何内容';
  $('#bodyHint').className = 'hint' + (len ? '' : ' bad');
  return ok;
}

/* ═══ 渲染右栏预览（本地模拟官方装配）═══ */
function renderPreview(){
  const st = $('#pvBox');
  const rows = [];
  if(pvMode === 'system'){
    const mine = blocks.filter(b=>b.type==='system' && b.enabled && b.title.trim());
    mine.forEach(b => rows.push({order:b.order, name:'gw-text-inject:'+b.title, text:b.body, mine:true, off:!b.enabled}));
    SYS_OFFICIAL.forEach(o => rows.push({...o, mine:false}));
  } else {
    const mine = blocks.filter(b=>b.type==='context' && b.enabled && b.title.trim());
    mine.forEach(b => rows.push({order:b.order, name:'gw-text-inject:'+b.title, text:b.body, mine:true}));
    CTX_OFFICIAL.forEach(o => rows.push({...o, mine:false}));
  }
  rows.sort((a,b)=> a.order - b.order || (a.name<b.name?-1:a.name>b.name?1:0));

  if(!rows.length){
    st.innerHTML = '<div class="hint">这一侧目前没有任何段。</div>';
  } else {
    st.innerHTML = rows.map(r=>{
      const lines = (r.text||'').split('\n').length;
      const first = (r.text||'').split('\n')[0];
      return `<div class="pv ${r.mine?'mine':''}">
        <div class="h">
          <span class="od">${r.order>0?' ':''}${r.mine?'['+r.order+']':'['+r.order+']'}</span>
          <span class="nm">${esc(r.name)}</span>
          <span class="ln">${lines} 行</span>
        </div>
        <div class="tx">${esc(first)}</div>
      </div>`;
    }).join('');
  }

  // 原文
  const mineBlocks = blocks.filter(b=>b.type===pvMode && b.enabled && b.title.trim());
  if(mineBlocks.length){
    $('#pvRawWrap').style.display='';
    $('#pvRaw').textContent = mineBlocks.map(b=>b.body).join('\n\n');
    const chars = mineBlocks.reduce((s,b)=>s+b.body.length,0);
    $('#pvRawNote').textContent = `共 ${fmt(chars)} 字符 · 框内可滚动`;
  } else {
    $('#pvRawWrap').style.display='';
    $('#pvRaw').textContent = '（此标签下你没有启用中的块）';
    $('#pvRawNote').textContent = '';
    $('#pvRaw').style.color = 'var(--ink-3)';
  }
  if(mineBlocks.length) $('#pvRaw').style.color = '';

  // 统计
  const officialLen = (pvMode==='system'?SYS_OFFICIAL:CTX_OFFICIAL).reduce((s,o)=>s+o.text.length+o.name.length,0);
  const mineLen = mineBlocks.reduce((s,b)=>s+b.body.length+('gw-text-inject:'+b.title).length,0);
  const total = officialLen + mineLen + (pvMode==='context' && mineBlocks.length ? CTX_PREAMBLE.length : 0);
  const pct = total ? (mineLen/total*100) : 0;
  $('#stTotal').textContent = fmt(total) + ' 字符';
  $('#stMine').textContent  = fmt(mineLen) + ' 字符';
  $('#stPct').textContent   = pct.toFixed(1) + '%';
  $('#bar').innerHTML = `<i style="background:var(--brand);width:${pct}%"></i><i style="background:#cbd5e1;width:${100-pct}%"></i>`;
  $('#pvHint').textContent = pvMode==='system'
    ? '官方按 order 升序拼装，段之间用空行连接'
    : '官方会前置一句「快照取代旧快照」的声明，内容没变就不重复发';
}

/* ═══ 体检 ═══ */
function renderChecks(){
  const out = [];
  const ne = blocks.filter(b=>b.enabled && !b.title.trim());
  const eb = blocks.filter(b=>b.enabled && !b.body.trim());
  const ids = {};
  blocks.forEach(b=>{ const k=b.type+':'+b.id; (ids[k]=ids[k]||[]).push(b.title||'(空)'); });
  const dups = Object.entries(ids).filter(([,v])=>v.length>1);
  const ctxNoTrig = blocks.filter(b=>b.type==='context'&&b.enabled&&b.body.trim());

  out.push({k:'ok', ic:'✓', t:`${blocks.filter(b=>b.enabled).length} 个块处于启用状态`});
  ne.forEach(b=>out.push({k:'bad', ic:'!', t:`「${b.title||'未命名'}」标题为空，不会被注册`}));
  eb.forEach(b=>out.push({k:'bad', ic:'!', t:`「${b.title}」正文为空，启用也不产生内容`}));
  dups.forEach(([k,v])=>out.push({k:'bad', ic:'!', t:`${k.startsWith('system')?'系统':'上下文'}块 id 重复：${v.join(' / ')} —— 加载时会抛错`}));
  if(!dups.length && !ne.length) out.push({k:'ok', ic:'✓', t:'没有重复的块 id'});
  if(ctxNoTrig.length) out.push({k:'ok', ic:'✓', t:`${ctxNoTrig.length} 个上下文块每轮都会投影（内容不变时官方不会重发）`});
  const trg = blocks.filter(b=>b.trigger && b.trigger.trim());
  if(trg.length) out.push({k:'warn', ic:'·', t:`${trg.length} 个块设了触发词 —— 门控逻辑待你拍板（见 design-v2.md 第四节）`});
  out.push({k:'ok', ic:'✓', t:'切换开关/改正文 无需重启，下一轮对话立即生效'});
  out.push({k:'warn', ic:'·', t:'上下文改动是「追加新快照」，历史消息不受影响'});
  $('#checks').innerHTML = out.map(c=>`<div class="chk ${c.k}"><span class="ic">${c.ic}</span><span>${c.t}</span></div>`).join('');
}

/* ═══ 交互 ═══ */
function sel(id){ if(dirty && !confirm('当前有未保存的修改，切走会丢失。继续？')) return; curId=id; dirty=false; renderEdit(); renderList(); }
function addBlock(){
  const id = 'block-' + (blocks.length+1);
  blocks.push({id, type:'context', title:'', desc:'', enabled:true, order:120, trigger:'', body:''});
  curId = id; dirty = false;
  renderList(); renderEdit(); renderPreview(); renderChecks();
  $('#fTitle').focus();
}
function delBlock(){
  const b = cur();
  if(!confirm('删除「' + (b.title||'未命名') + '」？')) return;
  blocks = blocks.filter(x=>x.id!==curId);
  curId = blocks.length ? blocks[0].id : '';
  dirty=false;
  renderList(); renderEdit(); renderPreview(); renderChecks();
}
function toggle(id){
  const b = blocks.find(x=>x.id===id);
  b.enabled = !b.enabled;
  renderList(); renderPreview(); renderChecks();
  if(b.id===curId) renderEdit();
  flash('已保存 · 下一轮生效 · 无需重启');
}
function setType(t){
  const b = cur(); if(!b) return;
  b.type = t;
  if(t==='context' && (!b.order || b.order===40)) b.order = 120;
  if(t==='system' && b.order===120) b.order = 40;
  $('#fOrder').value = b.order;
  renderEdit(); renderList(); renderPreview(); renderChecks();
}
function setPv(m){ pvMode=m; renderPvSeg(); renderPreview(); }
function toggleAdv(){ $('#advBox').classList.toggle('open'); }
function save(){
  const b = cur(); if(!b) return;
  if(!validate()){ setStatus('有错误未修正，未保存', 'busy'); return; }
  b.title = $('#fTitle').value.trim();
  b.desc  = $('#fDesc').value.trim();
  b.body  = $('#fBody').value;
  b.order = Number($('#fOrder').value);
  b.trigger = $('#fTrigger').value.trim();
  dirty = false;
  renderList(); renderEdit(); renderPreview(); renderChecks();
  flash('已保存 · 下一轮生效 · 无需重启');
}
function revert(){ renderEdit(); dirty=false; }
function flash(t){ setStatus(t, 'busy'); setTimeout(()=>setStatus('已保存 · 下一轮生效 · 无需重启'), 1400); }
['fTitle','fDesc','fBody','fOrder','fTrigger'].forEach(id=>{
  document.addEventListener('input', e=>{
    if(e.target && e.target.id===id){
      dirty = true; validate();
      const b = cur(); if(b){ b.title = $('#fTitle').value; b.body = $('#fBody').value; b.desc=$('#fDesc').value; b.order=Number($('#fOrder').value)||b.order; }
      renderList(); renderPreview(); renderChecks();
    }
  });
});

/* ═══ 历史抽屉 ═══ */
const HISTORY = [
  {t:'2026-09-23 17:45:50', size:'6,740 B', add:0, del:0, pin:true,  note:'当前版本'},
  {t:'2026-09-23 17:45:46', size:'764 B',   add:12, del:3, pin:false},
  {t:'2026-09-23 17:42:53', size:'803 B',   add:2,  del:1, pin:false},
  {t:'2026-09-23 17:42:50', size:'849 B',   add:0,  del:0, pin:false, note:'初始种子'}
];
function openHistory(){ $('#mask').classList.add('on'); $('#drawer').classList.add('on'); renderHistory(); }
function closeHistory(){ $('#mask').classList.remove('on'); $('#drawer').classList.remove('on'); }
function renderHistory(){
  $('#histList').innerHTML = HISTORY.map((h,i)=>`
    <div class="hi">
      <div class="t">${h.t} ${h.pin?'<span class="tag" style="background:#fef3c7;color:#92400e">已钉住</span>':''}</div>
      <div class="m">
        <span>${h.size}</span>
        ${h.add?`<span class="p">+${h.add} 行</span>`:''}
        ${h.del?`<span style="color:var(--danger)">−${h.del} 行</span>`:''}
        ${h.note?`<span>${h.note}</span>`:''}
      </div>
      <div class="acts">
        <button class="btn sm" onclick="showDiff(${i})">看差异</button>
        <button class="btn sm" onclick="alert('恢复到此版本（原型演示）')">恢复</button>
        <button class="btn sm" onclick="HISTORY[${i}].pin=!HISTORY[${i}].pin;renderHistory()">${h.pin?'取消钉住':'钉住不裁'}</button>
      </div>
      <div id="diff-${i}"></div>
    </div>`).join('');
}
function showDiff(i){
  const d = $('#diff-'+i);
  if(d.innerHTML){ d.innerHTML=''; return; }
  const sample = [
    {k:'c', t:'## [context] 项目背景'},
    {k:'c', t:'描述: 当前在做的项目，每轮都要记住'},
    {k:'c', t:''},
    {k:'c', t:'当前项目：dsh 文字注入插件。'},
    {k:'d', t:'-目标路径 Z:\\dsh\\@gw\\dsh-text-inject'},
    {k:'a', t:'+目标路径 Z:\\dsh\\@gw\\dsh-text-inject（web profile）'},
    {k:'a', t:'+用户偏好：先分析再分步骤执行'},
    {k:'c', t:''},
    {k:'c', t:'## [context] 部署注意事项'},
    {k:'d', t:'-（上一版没有这一段）'}
  ];
  d.innerHTML = '<div class="diff">' + sample.map(s=>`<span class="${s.k}">${esc(s.t||' ')}</span>`).join('') + '</div>';
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeHistory(); });

/* ═══ 初始化 ═══ */
(function initFromQuery(){
  const q = new URLSearchParams(location.search);
  const b = q.get('block'); if(b && blocks.some(x=>x.id===b)) curId = b;
  const p = q.get('pv'); if(p==='context'||p==='system') pvMode = p;
  renderList(); renderEdit(); renderPvSeg(); renderPreview(); renderChecks();
  if(q.get('adv')==='1') toggleAdv();
  if(q.get('hist')==='1') openHistory();
})();
</script>
